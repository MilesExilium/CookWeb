<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff6b35; font-size: 2.5rem; margin-bottom: 0.5rem; }
        p  { color: #888; margin-bottom: 2rem; }
        a  {
            display: block;
            background: #ff6b35;
            color: white;
            padding: 0.9rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }
        a:hover { background: #e55a25; }
        a.secondary {
            background: white;
            color: #ff6b35;
            border: 2px solid #ff6b35;
        }
        a.secondary:hover { background: #fff3ee; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🍽️ UniBite</h1>
        <p>Φοιτητικό Food Sharing</p>
        <a href="cook/index.html">👨‍🍳 Είμαι Μάγειρας</a>
        <a href="cook/dashboard.html" class="secondary">📋 Dashboard Μάγειρα</a>
    </div>
</body>
</html>
