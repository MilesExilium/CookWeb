<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Dashboard Μάγειρα</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🍽️ UniBite</div>
    <div class="nav-links">
        <span id="points-display">⭐ Πόντοι: <strong id="user-points">-</strong></span>
        <a href="index.html">➕ Νέα Αγγελία</a>
    </div>
</nav>

<div class="container">

    <!-- Αγγελίες -->
    <section class="section">
        <h2>📋 Οι Αγγελίες μου</h2>
        <div id="listings-container">
            <p class="loading">Φόρτωση...</p>
        </div>
    </section>

    <!-- Αιτήματα -->
    <section class="section">
        <h2>📬 Αιτήματα Μερίδων</h2>
        <div id="requests-container">
            <p class="loading">Φόρτωση...</p>
        </div>
    </section>

</div>

<!-- Modal Επεξεργασίας -->
<div id="edit-modal" class="modal hidden">
    <div class="modal-content">
        <h3>✏️ Επεξεργασία Αγγελίας</h3>

        <div class="form-group">
            <label>Τίτλος *</label>
            <input type="text" id="edit-title" required>
        </div>

        <div class="form-group">
            <label>Διαθέσιμες μερίδες *</label>
            <input type="number" id="edit-portions" min="0" required>
        </div>

        <div class="form-group">
            <label>Σημείο παραλαβής *</label>
            <input type="text" id="edit-location" required>
        </div>

        <div class="form-group">
            <label>Ώρα παραλαβής *</label>
            <input type="time" id="edit-time" required>
        </div>

        <div class="form-group">
            <label>Σημειώσεις</label>
            <textarea id="edit-notes" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Αλλεργιογόνα</label>
            <div class="allergens-grid" id="edit-allergens-grid">
                <label><input type="checkbox" value="Γλουτένη"> Γλουτένη</label>
                <label><input type="checkbox" value="Γαλακτοκομικά"> Γαλακτοκομικά</label>
                <label><input type="checkbox" value="Αυγά"> Αυγά</label>
                <label><input type="checkbox" value="Ξηροί καρποί"> Ξηροί καρποί</label>
                <label><input type="checkbox" value="Φιστίκια"> Φιστίκια</label>
                <label><input type="checkbox" value="Θαλασσινά"> Θαλασσινά</label>
                <label><input type="checkbox" value="Ψάρι"> Ψάρι</label>
                <label><input type="checkbox" value="Σόγια"> Σόγια</label>
                <label><input type="checkbox" value="Σέλινο"> Σέλινο</label>
                <label><input type="checkbox" value="Μουστάρδα"> Μουστάρδα</label>
                <label><input type="checkbox" value="Σουσάμι"> Σουσάμι</label>
                <label><input type="checkbox" value="Θειώδη"> Θειώδη</label>
                <label><input type="checkbox" value="Λούπινα"> Λούπινα</label>
                <label><input type="checkbox" value="Μαλάκια"> Μαλάκια</label>
            </div>
        </div>

        <div id="edit-message" class="message hidden"></div>

        <div class="modal-buttons">
            <button id="save-edit-btn" class="btn-primary">💾 Αποθήκευση</button>
            <button id="cancel-edit-btn" class="btn-secondary">❌ Άκυρο</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
